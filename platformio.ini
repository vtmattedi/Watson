; Watson acoustic firmware (Waveshare ESP32-C3-Zero + one INMP441).
; Classic ESP32 DevKit V1 remains an explicit build target.
;
; Platform: pioarduino (Arduino core 3.3.x / ESP-IDF 5.5). NightMareNetwork
; is developed against it, and the I2S code here uses the IDF 5 channel API.

[platformio]
default_envs = esp32c3-zero

[env:esp32dev]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.39/platform-espressif32.zip
board = esp32dev
framework = arduino

; Two OTA slots + a small LittleFS ("spiffs") partition. See the file for the
; flash arithmetic. NightMareNetwork's OTA needs the second slot.
board_build.partitions = src/OtaDual.csv
board_build.filesystem = littlefs

monitor_speed = 921600
monitor_filters = send_on_enter, esp32_exception_decoder

; Wi-Fi / OTA go through the CH340 on COM18 by default; override on the
; command line (pio run -t upload --upload-port <ip>) for OTA.
upload_port = 10.10.3.3
; upload_protocol = espota
monitor_port = COM18

lib_deps =
    https://github.com/vtmattedi/NightMareNetwork.git
    kosme/arduinoFFT

build_flags =
    -O2
    -DCORE_DEBUG_LEVEL=1
    ; NightMareNetwork no longer lists ArduinoOTA as a dependency. PlatformIO's
    ; dependency finder cannot see NM_ENABLE_OTA from NightMareConfig.h (it is
    ; reached through __has_include), so without this flag the library is built
    ; without the ArduinoOTA include path. Keep it in step with NightMareConfig.h.
    -DNM_ENABLE_OTA=1
    ; The raw PCM debug server. -DENABLE_TCP=0 builds it out entirely.
    -DENABLE_TCP=1
    ; arduinoFFT only reorders the imaginary array when told the input is
    ; complex; the extractor feeds it a packed (complex) transform. Fft.cpp
    ; refuses to compile without it.
    -DCOMPLEX_INPUT
    ; -DWATSON_HEAP_TRACE=1   prints the free internal heap every 2 s

; The same firmware without the raw PCM debug server: no TCP module code, no
; listening socket, nothing for it to cost at run time.
[env:esp32dev-notcp]
extends = env:esp32dev
build_unflags = -DENABLE_TCP=1
build_flags =
    ${env:esp32dev.build_flags}
    -DENABLE_TCP=0

; Waveshare ESP32-C3-Zero: native USB Serial/JTAG, 4 MB flash, one INMP441.
; WS/LRCLK = GPIO6, SCK/BCLK = GPIO7, SD/DIN = GPIO4, L/R = GND.
; C3 is single-core and has less RAM/CPU headroom; disable raw PCM TCP.
; Analysis timing, radio coexistence, and OTA need on-device validation.
[env:esp32c3-zero]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.39/platform-espressif32.zip
board = esp32-c3-devkitm-1
framework = arduino
board_build.partitions = src/OtaDual.csv
board_build.filesystem = littlefs
monitor_speed = 921600
monitor_filters = send_on_enter, esp32_exception_decoder
lib_deps =
    https://github.com/vtmattedi/NightMareNetwork.git
    kosme/arduinoFFT
build_flags =
    -O2
    -DCORE_DEBUG_LEVEL=1
    -DNM_ENABLE_OTA=1
    -DENABLE_TCP=0
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCOMPLEX_INPUT
